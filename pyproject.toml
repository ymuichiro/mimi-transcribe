[project]
name = "mimitranscribe"
version = "0.1.0"
description = "MimiTranscribe: local Japanese transcription app powered by Parakeet-TDT and PySide6"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "parakeet-mlx>=0.4.0",
    "mlx-whisper>=0.4.0",
    "PySide6>=6.7.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
bundle = [
    "pyinstaller>=6.10",
    "pyinstaller-hooks-contrib>=2024.7",
    "macholib>=1.16.3",
]

[project.scripts]
mimitranscribe = "main:main"

[project.license]
file = "LICENSE"
